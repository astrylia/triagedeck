services:
  postgres:
    image: postgres:18
    container_name: triage-postgres
    environment:
      POSTGRES_DB: triagedeck
      POSTGRES_USER: triagedeck
      POSTGRES_PASSWORD: triagedeck_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data: