name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 在 Windows 上提交的 mvnw 可能没有可执行权限
      - name: Make mvnw executable
        run: chmod +x mvnw

      # verify 会编译并运行全部测试；GitHub 的 Ubuntu 机器自带 Docker，Testcontainers 可以直接用
      - name: Build and test
        run: ./mvnw -B verify
