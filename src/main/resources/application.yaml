spring:
  application:
    name: TriageDeck
  datasource:
    url: jdbc:postgresql://localhost:5432/triagedeck
    username: triagedeck
    password: triagedeck_dev
  jpa:
    hibernate:
      ddl-auto: validate   # 表结构由 Flyway 管理，Hibernate 只校验实体和表是否一致
    open-in-view: false    # 不在视图层保持数据库会话，避免隐蔽的懒加载查询
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 只用来限流，不响应时要尽快失败、放行请求（见 RateLimiter）。
      # 不配的话 Lettuce 默认命令超时 60 秒，Redis 卡住时每个登录请求都要等满 60 秒。
      timeout: 500ms
      connect-timeout: 1s
  mail:
    # 本地开发发到 docker compose 里的 Mailpit（不需要账号密码）
    # 部署时用环境变量指向真实的发信服务：MAIL_HOST、MAIL_PORT，账号密码用 SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

management:
  endpoints:
    web:
      exposure:
        include: health,info

triagedeck:
  jwt:
    # 签名密钥：生产环境必须通过环境变量 JWT_SECRET 提供；下面的默认值只用于本地开发和测试
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  mail:
    from: ${MAIL_FROM:TriageDeck <no-reply@triagedeck.local>}
  registration-link:
    # 邮件里的链接指向前端的设密码页面：<url>?token=...
    url: ${REGISTRATION_LINK_URL:http://localhost:5173/register}
    # 1 小时没有标准依据：要够邮件延迟、用户晚点才看到，又不让链接在邮箱里长期有效
    ttl: 1h
    # 同一个邮箱 60 秒内只发一次
    resend-cooldown: 60s
  rate-limit:
    enabled: true
    # 这些数字没有标准可依（NIST、OWASP 都只给原则，不给"每分钟几次"），是按下面的思路估的：
    # 按 IP 的限制只用来挡脚本批量刷，放得很宽。B2B 客户一个办公室的员工通常共用一个出口 IP，
    # 新客户一次让几十个员工注册、登录，不能被挡住。防猜测靠按账号/按邮箱的限制（OWASP：失败计数要跟账号走，不跟 IP 走）。
    login-per-ip:
      limit: 100
      window: 1m
    # 同一个邮箱每分钟最多尝试登录 10 次（不管从哪个 IP 来），防止分散 IP 猜同一个账号的密码
    login-per-email:
      limit: 10
      window: 1m
    register-per-ip:
      limit: 100
      window: 1h
    # 同一个邮箱另有 60 秒的发信冷却（见上面的 registration-link）
    registration-link-per-ip:
      limit: 50
      window: 10m
